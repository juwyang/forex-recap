name: FX recap

# Two editions a day, both anchored to 07:00 / 19:00 Europe/Zurich. GitHub
# cron is UTC and has no DST awareness, so each edition is scheduled at both
# its summer and winter UTC hour and the job discards the twin that is an
# hour off -- by reading which cron fired and what Zurich's offset is now,
# never by looking at the wall clock, because a scheduled run routinely
# arrives late enough to have crossed into the next hour.
#
# Minute 8 rather than 0: the top of the hour is the most congested slot on
# GitHub's scheduler and the worst place to queue.
on:
  schedule:
    - cron: "8 5 * * 1-5"    # 07:08 CEST (summer)
    - cron: "8 6 * * 1-5"    # 07:08 CET  (winter)
    - cron: "8 17 * * 1-5"   # 19:08 CEST (summer)
    - cron: "8 18 * * 1-5"   # 19:08 CET  (winter)
  workflow_dispatch:
    inputs:
      edition:
        description: "Which edition to build"
        type: choice
        options: [auto, morning, evening]
        default: auto
      date:
        description: "Report date YYYY-MM-DD (blank = today, Zurich)"
        type: string
        default: ""

concurrency:
  group: fx-recap
  cancel-in-progress: false

# Declared per job, not once at the top: a workflow-level block does not
# reliably reach the job that needs OIDC, and deploy-pages then fails with
# 'Ensure GITHUB_TOKEN has permission "id-token: write"'.
permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # commit the report back into the repo
      pages: write           # upload the Pages artifact
      id-token: write
    outputs:
      built: ${{ steps.decide.outputs.built }}
    steps:
      - uses: actions/checkout@v4

      - name: Decide which edition this run is
        id: decide
        env:
          IN_EDITION: ${{ inputs.edition }}
          IN_DATE: ${{ inputs.date }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          OFFSET=$(TZ=Europe/Zurich date +%z)   # +0200 summer, +0100 winter
          EDITION="${IN_EDITION:-auto}"
          skip() { echo "$1"; echo "built=false" >> "$GITHUB_OUTPUT"; exit 0; }

          if [ -n "$SCHEDULE" ]; then
            # Scheduled: the cron that fired names the edition, and Zurich's
            # current offset says whether this is the live twin or the spare.
            # Neither depends on when the runner actually got round to us.
            # The ":00" forms are the previous schedule, kept so a run already
            # queued under it is honoured rather than silently discarded.
            case "$SCHEDULE" in
              "8 5 * * 1-5"|"0 5 * * 1-5")   EDITION=morning; WANT="+0200" ;;
              "8 6 * * 1-5"|"0 6 * * 1-5")   EDITION=morning; WANT="+0100" ;;
              "8 17 * * 1-5"|"0 17 * * 1-5") EDITION=evening; WANT="+0200" ;;
              "8 18 * * 1-5"|"0 18 * * 1-5") EDITION=evening; WANT="+0100" ;;
              *) skip "Unrecognised schedule '$SCHEDULE' - the cron list changed under a queued run." ;;
            esac
            [ "$OFFSET" = "$WANT" ] ||               skip "Zurich is at $OFFSET; '$SCHEDULE' is the $WANT twin. Skipping."
            echo "Schedule '$SCHEDULE' at offset $OFFSET -> $EDITION edition."
          elif [ "$EDITION" = "auto" ] || [ -z "$EDITION" ]; then
            # Manual run set to auto: no cron to read, so fall back to the
            # clock with a wide band either side of each cutoff.
            HOUR=$(TZ=Europe/Zurich date +%H)
            case "$HOUR" in
              0[5-9]|1[0-1]) EDITION=morning ;;
              1[7-9]|2[0-3]) EDITION=evening ;;
              *) skip "Zurich local hour is $HOUR, not near either cutoff - pick an edition explicitly." ;;
            esac
          fi

          # The report date is the last day whose cutoff for this edition has
          # passed -- not the date the runner happens to start on. A Friday
          # 19:00 run delivered at 02:56 on Saturday still recaps Friday;
          # reading the clock instead built "Saturday", which does not exist.
          CUT=19; [ "$EDITION" = "morning" ] && CUT=7
          NOW_H=$(TZ=Europe/Zurich date +%H)
          if [ "$((10#$NOW_H))" -lt "$CUT" ]; then
            DATE=$(TZ=Europe/Zurich date -d "yesterday" +%F)
          else
            DATE=$(TZ=Europe/Zurich date +%F)
          fi
          DATE="${IN_DATE:-$DATE}"
          echo "Resolved to the $EDITION edition of $DATE (local hour $NOW_H)."

          echo "edition=$EDITION" >> "$GITHUB_OUTPUT"
          echo "date=$DATE"       >> "$GITHUB_OUTPUT"
          echo "built=true"       >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.decide.outputs.built == 'true'
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        if: steps.decide.outputs.built == 'true'
        run: pip install -r requirements.txt

      - name: Build report
        if: steps.decide.outputs.built == 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python -m forexrecap.run \
            --date "${{ steps.decide.outputs.date }}" \
            --edition "${{ steps.decide.outputs.edition }}" \
            --out reports

      - name: Fill in anything the scheduler dropped
        if: steps.decide.outputs.built == 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        # GitHub's scheduler is best-effort and has dropped slots outright, so
        # the archive is repaired from whichever trigger does fire rather than
        # relying on each one arriving. Only windows that have already closed
        # are built.
        run: python -m forexrecap.run --catchup --out reports

      - name: Summarise
        if: steps.decide.outputs.built == 'true'
        continue-on-error: true
        run: |
          STEM="${{ steps.decide.outputs.date }}-${{ steps.decide.outputs.edition }}"
          MONTH=$(echo "${{ steps.decide.outputs.date }}" | cut -c1-7)
          python - "$MONTH/$STEM.json" <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os, sys
          path = "reports/" + sys.argv[1]
          if not os.path.exists(path):
              # A weekend date, or a window that has not closed: the build
              # legitimately wrote nothing. Say so instead of raising.
              print("No edition was published for %s." % sys.argv[1])
              raise SystemExit(0)
          d = json.load(open(path, encoding="utf-8"))
          m, a = d["meta"], d.get("analysis") or {}
          print("## %s %s\n" % (m["edition_title"], m["date"]))
          print("- instruments: %d loaded, %d failed" %
                (m["instruments_loaded"], len(m["instruments_failed"])))
          cal = m.get("calendar") or {}
          print("- calendar: %s (%d actuals)" %
                ("DEGRADED - no actuals" if cal.get("degraded") else "ok via %s" % cal.get("profile"),
                 cal.get("with_actual", 0)))
          print("- analysis: %s" % (a.get("error") or a.get("_model", "not run")))
          if a.get("session_summary"):
              print("\n%s" % a["session_summary"])
          PY

      - name: Commit
        if: steps.decide.outputs.built == 'true'
        run: |
          git config user.name  "fx-recap bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "recap ${{ steps.decide.outputs.date }} ${{ steps.decide.outputs.edition }}"
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        if: steps.decide.outputs.built == 'true'
        with:
          path: reports

  publish:
    needs: build
    if: needs.build.outputs.built == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write           # deploy the uploaded artifact
      id-token: write        # OIDC token deploy-pages exchanges for it
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
